services:
  app:
    build: .
    environment:
      # Read from the host shell; falls back to .env (copy .env.example) if present.
      DELIVERY_AI_PROVIDER: ${DELIVERY_AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.6}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-MiniMaxAI/MiniMax-M3}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
    volumes:
      # Persist the agent's research CSV/JSONL outside the container; the
      # dashboard unions it into the supplier list at request time.
      - agent-output:/app/deep-research-agent/output
    ports:
      - "3000:3000"

volumes:
  agent-output:
